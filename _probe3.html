<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IZEX probe</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/appointments.js"></script>
  <script src="js/views/clients.js"></script>
  <script src="js/views/patients.js"></script>
  <script src="js/views/records.js"></script>
  <script src="js/views/prescriptions.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/billing.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <script>
  setTimeout(function () {
    try {
      var t = [];
      function R(el) { var r = el.getBoundingClientRect(); return Math.round(r.top) + ".." + Math.round(r.bottom); }
      t.push("winH:" + window.innerHeight + " clientH:" + document.documentElement.clientHeight + " scrollH:" + document.documentElement.scrollHeight);
      t.push("app:" + R(document.querySelector(".app")) + " h:" + getComputedStyle(document.querySelector(".app")).height);
      t.push("sidebar:" + R(document.getElementById("sidebar")) + " h:" + getComputedStyle(document.getElementById("sidebar")).height + " of:" + getComputedStyle(document.getElementById("sidebar")).overflowY);
      t.push("brand:" + R(document.querySelector(".brand")));
      t.push("nav:" + R(document.getElementById("mainNav")));
      t.push("foot:" + R(document.querySelector(".sidebar-foot")));
      document.querySelectorAll(".side-action").forEach(function (a, i) {
        t.push("act" + i + ":" + R(a) + " '" + a.textContent.trim() + "'");
      });
      document.title = "MEAS " + t.join(" | ");
    } catch (e) {
      document.title = "MEASERR " + e.message;
    }
  }, 3000);
  </script>
</body>
</html>
