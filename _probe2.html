<!doctype html>
<html>
<head><meta charset="utf-8"><title>probe2</title></head>
<body>
<div id="out">pending</div>
<iframe id="fr1" src="index.html" style="width:1400px;height:950px;border:0"></iframe>
<iframe id="fr2" src="index.html" style="width:1400px;height:620px;border:0"></iframe>
<script>
function measure(id) {
  var d = document.getElementById(id).contentDocument;
  var foot = d.querySelector(".sidebar-foot");
  var acts = d.querySelectorAll(".side-action");
  var last = acts[acts.length - 1];
  var winH = d.defaultView.innerHeight;
  var r = foot.getBoundingClientRect();
  var r2 = last.getBoundingClientRect();
  return "footTop=" + Math.round(r.top) + " footH=" + Math.round(r.height) +
    " winH=" + winH + " lastBottom=" + Math.round(r2.bottom) +
    " clipped=" + (r2.bottom > winH) + " text='" + last.textContent.trim() + "'";
}
setTimeout(function () {
  try {
    document.getElementById("out").textContent =
      "GEOM950 " + measure("fr1") + " ;; GEOM620 " + measure("fr2");
  } catch (e) {
    document.getElementById("out").textContent = "GEOMERR " + e.message;
  }
}, 5000);
</script>
</body>
</html>
